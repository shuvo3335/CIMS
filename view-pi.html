<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proforma Invoices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="view-pi">
<div class="app">
<main>
  <div class="page-head">
    <div><h1>Proforma invoices</h1><p class="sub">All PIs and the contract each one is linked to.</p></div>
    <div class="actions"><label for="pisearch" class="sr-only">Search PIs</label><input id="pisearch" class="search" type="search" placeholder="Search by PI or contract no."></div>
  </div>
  <div class="stats">
    <div class="card stat"><p>Total PIs</p><p>3</p></div>
    <div class="card stat"><p>Accepted</p><p>1</p></div>
    <div class="card stat"><p>Issued</p><p>1</p></div>
    <div class="card stat"><p>Draft</p><p>1</p></div>
  </div>
  <div class="card table-wrap">
    <table style="min-width:1200px">
      <thead><tr><th scope="col">SPI list</th><th scope="col">PI No.</th><th scope="col">PI Date</th><th scope="col">PI Validity</th><th scope="col">Contract No.</th><th scope="col">Buyer</th><th scope="col">Seller</th><th scope="col">Commodity</th><th scope="col">Item Code</th><th scope="col">Origin</th><th scope="col">Unit Price (USD)</th><th scope="col">Actions</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p class="hint" id="empty" hidden>No PIs match your search.</p>
</main>
<a class="fab" href="create-pi.html" aria-label="Create PI"><span>+</span>Create PI</a>

<dialog id="pv" aria-labelledby="pv-title">
  <div class="modal">
    <div class="modal-head">
      <div><h2 id="pv-title"></h2><p id="pv-sub"></p></div>
      <div class="actions">
        <button type="button" class="icon-btn lg" id="pv-close" aria-label="Close details"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        <button type="button" class="btn btn-primary" id="pv-print"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>Print</button>
      </div>
    </div>
    <div class="modal-body" id="pv-body"></div>
  </div>
</dialog>
</div>
<script src="js/layout.js"></script>
<script src="js/view-pi.js"></script>
</body>
</html>
